# =============================================================================
# Sub2API Usage Viewer - nginx reverse proxy
# =============================================================================
# Put this in /etc/nginx/conf.d/ (or sites-available + symlink) and reload:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace usage.example.com with your domain, and adjust the TLS certificate
# paths (use certbot: sudo certbot --nginx -d usage.example.com).
#
# The viewer binds to 127.0.0.1:8081 and is only reachable through nginx.
# =============================================================================

server {
    listen 80;
    server_name usage.example.com;
    # Optional: redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name usage.example.com;

    ssl_certificate     /etc/letsencrypt/live/usage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usage.example.com/privkey.pem;

    # Proxy the whole application (single-page app + JSON APIs).
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reasonable timeouts for the viewer's read-only queries.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
}
