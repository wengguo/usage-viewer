<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 用量查询</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div class="flex min-h-screen items-center justify-center px-4">
    <div class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <div class="mb-6 flex items-center gap-2">
        <img src="/favicon.svg" alt="" class="h-7 w-7 flex-none rounded-md" width="28" height="28">
        <span class="font-semibold">Sub2API</span>
      </div>
      <h1 class="mb-1 text-lg font-semibold">登录</h1>
      <p class="mb-4 text-sm text-slate-600 dark:text-slate-400">登录后可查看 Key 查询与排行榜。</p>

      <form class="space-y-3" id="login-form" novalidate>
        <div>
          <label for="username" class="mb-1 block text-sm font-semibold text-slate-600 dark:text-slate-300">账号</label>
          <input id="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false"
            class="h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-slate-900 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
        </div>
        <div>
          <label for="password" class="mb-1 block text-sm font-semibold text-slate-600 dark:text-slate-300">密码</label>
          <input id="password" type="password" autocomplete="current-password"
            class="h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-slate-900 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
        </div>
        <button id="login-button" type="submit"
          class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-lg border border-teal-700 bg-teal-700 font-semibold text-white disabled:cursor-wait disabled:opacity-70">
          <span class="spinner" id="login-spinner" aria-hidden="true" hidden></span>
          <span id="login-button-label">登录</span>
        </button>
      </form>

      <div class="status-region min-h-[2.5rem] py-3 text-sm text-slate-600 dark:text-slate-400" id="login-status" role="status" aria-live="polite"></div>

      <a href="/" class="text-sm font-medium text-teal-700 hover:underline dark:text-teal-400">返回自助查询</a>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script src="/login.js" defer></script>
</body>
</html>
