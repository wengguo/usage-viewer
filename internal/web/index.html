<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用量查询</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <div class="flex min-h-screen">
    <div id="sidebar-overlay" class="fixed inset-0 z-30 bg-slate-900/50 md:hidden" hidden></div>

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-40 flex w-60 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-200 md:translate-x-0 dark:border-slate-800 dark:bg-slate-900">
      <div class="flex h-14 items-center justify-between gap-2 border-b border-slate-200 px-4 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <img src="/favicon.svg" alt="" class="h-7 w-7 flex-none rounded-md" width="28" height="28">
          <span class="font-semibold">Sub2API</span>
        </div>
        <button id="sidebar-close" type="button" class="flex h-8 w-8 items-center justify-center rounded-md text-slate-500 hover:bg-slate-100 md:hidden dark:text-slate-400 dark:hover:bg-slate-800" aria-label="关闭菜单">
          <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <nav class="flex-1 space-y-1 px-3 py-4">
        <a href="/" aria-current="page" class="flex items-center gap-3 rounded-lg bg-teal-50 px-3 py-2 text-sm font-medium text-teal-700 dark:bg-teal-900/40 dark:text-teal-300">
          <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5 flex-none" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Key 查询</span>
        </a>
        <a href="/leaderboard" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
          <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5 flex-none" aria-hidden="true"><path d="M6 3h8v5a4 4 0 01-8 0V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 4H4a1 1 0 000 5h1M14 4h2a1 1 0 010 5h-1" stroke="currentColor" stroke-width="1.6"/><path d="M10 12v3M8 17h4M8 15.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>排行榜</span>
        </a>
        <a href="/self" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
          <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5 flex-none" aria-hidden="true"><circle cx="10" cy="6.5" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>自助查询</span>
        </a>
        <a class="settings-link !hidden flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800" href="/credentials" title="数据库连接设置" hidden>
          <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5 flex-none" aria-hidden="true"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5.3 5.3l1.4 1.4M13.3 13.3l1.4 1.4M14.7 5.3l-1.4 1.4M6.7 13.3l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>设置</span>
        </a>
      </nav>

      <div class="border-t border-slate-200 p-3 dark:border-slate-800">
        <button type="button" data-theme-toggle class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
          <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5 flex-none" aria-hidden="true"><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span data-theme-label>浅色模式</span>
        </button>
      </div>
    </aside>

    <div class="flex-1 md:pl-60">
      <header class="flex h-14 items-center gap-3 border-b border-slate-200 bg-white px-4 md:hidden dark:border-slate-800 dark:bg-slate-900">
        <button id="sidebar-open" type="button" class="flex h-9 w-9 items-center justify-center rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800" aria-label="打开菜单">
          <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <span class="font-semibold">用量查询</span>
      </header>

      <main class="mx-auto max-w-6xl px-4 py-8">
        <div class="search-workspace">
          <form class="search-form" id="search-form" action="/api/search" method="post" novalidate>
            <label id="query-label" for="query" class="mb-2 block text-sm font-semibold text-slate-600 dark:text-slate-300">Key 名称或 Key</label>
            <div class="search-row flex gap-2">
              <input id="query" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="请输入 Key 名称或 Key 值" aria-describedby="search-status"
                class="h-11 w-full max-w-2xl min-w-0 rounded-lg border border-slate-300 bg-white px-3 text-slate-900 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
              <button id="search-button" type="submit"
                class="inline-flex h-11 w-32 flex-none items-center justify-center gap-2 rounded-lg border border-teal-700 bg-teal-700 font-semibold text-white disabled:cursor-wait disabled:opacity-70">
                <span class="spinner" id="search-spinner" aria-hidden="true" hidden></span>
                <span id="search-button-label">查找</span>
              </button>
            </div>
          </form>

          <div class="status-region min-h-[3rem] py-3 text-sm text-slate-600 dark:text-slate-400" id="search-status" role="status" aria-live="polite"></div>

          <section class="results mt-4" id="results" aria-busy="false" hidden>
            <h2 id="result-count" class="mb-4 text-xl font-semibold"></h2>

            <div class="hidden overflow-x-auto rounded-lg border border-slate-200 bg-white shadow-sm md:block dark:border-slate-800 dark:bg-slate-900" id="table-scroll">
              <table class="w-full min-w-[1200px] border-collapse">
                <thead><tr class="bg-slate-50 dark:bg-slate-800/50">
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">名称</th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">分组</th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">当前并发</th>
                  <th id="today-cost-header" scope="col" aria-sort="none" class="border-b border-slate-200 p-3 text-left dark:border-slate-800">
                    <button class="sort-button inline-flex items-center gap-1.5 text-sm font-semibold text-slate-600 hover:text-teal-700 dark:text-slate-300 dark:hover:text-teal-400" id="sort-today-cost" type="button" data-label="今日用量">今日用量 <span class="sort-direction text-xs font-medium text-slate-400">默认</span></button>
                  </th>
                  <th id="total-30d-cost-header" scope="col" aria-sort="none" class="border-b border-slate-200 p-3 text-left dark:border-slate-800">
                    <button class="sort-button inline-flex items-center gap-1.5 text-sm font-semibold text-slate-600 hover:text-teal-700 dark:text-slate-300 dark:hover:text-teal-400" id="sort-total-30d-cost" type="button" data-label="近30天用量">近30天用量 <span class="sort-direction text-xs font-medium text-slate-400">默认</span></button>
                  </th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">额度已用 / 总额度</th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">上次使用时间</th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">过期时间</th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">状态</th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">创建时间</th>
                  <th scope="col" class="border-b border-slate-200 p-3 text-left text-sm font-semibold text-slate-600 dark:border-slate-800 dark:text-slate-300">每日用量</th>
                </tr></thead>
                <tbody id="key-body"></tbody>
              </table>
            </div>

            <div class="block space-y-3 md:hidden" id="key-cards"></div>

            <nav class="pagination mt-4 flex items-center justify-between gap-3 text-sm text-slate-600 md:justify-end dark:text-slate-400" aria-label="Key 列表分页">
              <button class="pagination-button h-9 min-w-[76px] rounded-md border border-teal-700 px-3 font-semibold text-teal-700 disabled:cursor-wait disabled:opacity-70 dark:border-teal-600 dark:text-teal-400" id="previous-page" type="button">上一页</button>
              <span id="page-status" aria-live="polite"></span>
              <button class="pagination-button h-9 min-w-[76px] rounded-md border border-teal-700 px-3 font-semibold text-teal-700 disabled:cursor-wait disabled:opacity-70 dark:border-teal-600 dark:text-teal-400" id="next-page" type="button">下一页</button>
            </nav>
          </section>
        </div>
      </main>
    </div>
  </div>

  <dialog class="usage-dialog w-[min(820px,calc(100%-2rem))] max-h-[80vh] overflow-y-auto rounded-xl border border-slate-200 bg-white p-0 dark:border-slate-800 dark:bg-slate-900" id="usage-dialog">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 dark:border-slate-800">
      <h2 id="dialog-title" class="text-lg font-semibold"></h2>
      <button class="dialog-close flex h-9 w-9 items-center justify-center rounded-lg text-xl text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800" id="dialog-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="flex items-center gap-3 px-5 pt-4 text-sm font-semibold text-slate-600 dark:text-slate-300">
      <label for="dialog-days">天数</label>
      <select id="dialog-days" class="h-9 rounded-lg border border-slate-300 bg-white px-2 text-slate-900 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
        <option value="7">7 天</option>
        <option value="30" selected>30 天</option>
        <option value="90">90 天</option>
      </select>
    </div>
    <div class="chart-wrap px-5 pt-4" id="chart-wrap"></div>
    <div class="dialog-table-wrap mx-5 my-2 max-h-[40vh] overflow-y-auto border-y border-slate-200 dark:border-slate-800" id="dialog-table-wrap">
      <table class="w-full">
        <thead><tr>
          <th scope="col" class="p-3 text-left text-sm font-semibold text-slate-600 dark:text-slate-300">日期</th>
          <th scope="col" class="p-3 text-left text-sm font-semibold text-slate-600 dark:text-slate-300">消耗费用 (USD)</th>
        </tr></thead>
        <tbody id="daily-body"></tbody>
      </table>
    </div>
    <div class="dialog-status min-h-[2rem] px-5 pb-4 text-sm text-slate-600 dark:text-slate-400" id="dialog-status" role="status" aria-live="polite"></div>
  </dialog>

  <script src="/theme.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
